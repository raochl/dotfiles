[keys]
# Match the tmux prefix.
prefix = "ctrl+a"

# Session and workspace.
detach = "prefix+d"
reload_config = "prefix+r"
workspace_picker = "prefix+w"
new_workspace = "prefix+shift+c"
toggle_sidebar = "prefix+backtick"

# Herdr tabs map to tmux windows.
new_tab = "prefix+c"
previous_tab = ["prefix+b", "prefix+left"]
next_tab = ["prefix+n", "prefix+right"]
move_tab_previous = "prefix+shift+b"
move_tab_next = "prefix+shift+n"

# Pane focus and layout.
focus_pane_left = "prefix+h"
focus_pane_down = "prefix+j"
focus_pane_up = "prefix+k"
focus_pane_right = "prefix+l"
split_vertical = "prefix+|"
split_horizontal = "prefix+minus"
zoom = "prefix+m"
copy_mode = "prefix+["

# Match tmux H/J/K/L resize bindings.
resize_pane_left = "prefix+shift+h"
resize_pane_down = "prefix+shift+j"
resize_pane_up = "prefix+shift+k"
resize_pane_right = "prefix+shift+l"

# Match tmux </> pane swapping and free H/J/K/L for resizing.
swap_pane_left = ""
swap_pane_right = ""
swap_pane_up = "prefix+<"
swap_pane_down = "prefix+>"

# Preserve Ctrl+V for Neovim visual-block mode during remote attaches.
remote_image_paste = "ctrl+alt+v"

[ui.sidebar.agents.rows_by_agent]
# OMP: show the live task title and explicit lifecycle state.
omp = [["state_icon", "workspace"], ["terminal_title_stripped"], ["agent", "state_text"]]
