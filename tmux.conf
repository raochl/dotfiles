
### Common setting
##########################################################

# Using UTF-8 Encode
#setw -g utf8 on
#set-option -g status-utf8 on
set-option -g default-shell /bin/zsh
set -g default-terminal "tmux-256color"	# literal, not $ZSH_TMUX_TERM (empty when tmux starts outside zsh)

# History limit
set -g history-limit 1000000

# index from 1
set -g base-index 1
set -g pane-base-index 1
set -g renumber-windows on

# enable mouse
set-option -g mouse on
# include resize pane, select pane, select windows, select txt
#
# tmux 3.5a drops mouse events in the top rows of a window with
# pane-border-status top (fixed in tmux 3.6); bars live at the BOTTOM instead,
# and pane/border clicks both select the pane (drag on a border still resizes).
bind -T root MouseDown1Pane select-pane -t = \; send-keys -M
bind -T root MouseDown1Border select-pane -t = \; resize-pane -M

# General behavior
set -g set-clipboard on
set -g detach-on-destroy off


# source file
unbind r 
bind r source-file ~/.tmux.conf \; display-message "Config reloaded..."


### shot key
###########################################################
# disable C-b
unbind C-b

# Using C-a for prefix
set  -g prefix C-a
bind C-a send-prefix

# switch to last window using multiple prefix command
#bind C-a last-window

# Switch pane like vim '-r' for recursive key enable
bind -r h select-pane -L
bind -r j select-pane -D
bind -r k select-pane -U
bind -r l select-pane -R

# Switch windows
bind b previous-window
unbind -n C-Left
unbind -n C-Right
bind -r Left select-window -t :-	# Prefix + left changes to previous window
bind -r Right select-window -t :+	# Prefix + right changes to next window

#bind f next-window
# Swap window
bind B swap-window -t -1
bind N swap-window -t +1

# Split windows
bind | split-window -h -c '#{pane_current_path}'    # split and enter current path by default
bind - split-window -v -c '#{pane_current_path}'    # split and enter current path by default
bind c new-window -c '#{pane_current_path}'
unbind '"'
unbind %

# Copy mode
bind Escape copy-mode					# Use prefix before press esc key to enter copy mode
bind -T copy-mode-vi v send-keys -X begin-selection	# use the arrow keys to the start point you want to copy and press v
bind -T copy-mode-vi y send-keys -X copy-pipe-and-cancel "pbcopy"	# or enter to ensure copy, then you can change to another window to paste
bind -T copy-mode-vi r send-keys -X rectangle-toggle	# switch between copy rectangle or overall line
bind -T copy-mode-vi MouseDragEnd1Pane send-keys -X copy-pipe-and-cancel "pbcopy"	# mouse drag release copies to tmux buffer + system clipboard
# unbind p 
bind P paste-buffer	# Need to use prefix before press P
setw -g mode-keys vi

# Resize panes without overriding h/j/k/l pane switching
bind -r H resize-pane -L 5
bind -r J resize-pane -D 5
bind -r K resize-pane -U 5
bind -r L resize-pane -R 5
bind -r m resize-pane -Z

# Swap panes
bind -r < swap-pane -U
bind -r > swap-pane -D

######################
### DESIGN CHANGES ###
######################

# loud or quiet?
set -g visual-activity off
set -g visual-bell off
set -g visual-silence off
setw -g monitor-activity off
set -g bell-action none

setw -g clock-mode-colour '#81A1C1'
setw -g mode-style 'fg=#2E3440 bg=#81A1C1'

# panes: title bar on every pane; active pane gets a solid green bar so
# click-to-focus gives immediate visible feedback
set -g pane-border-status bottom
set -g pane-border-format ' #{pane_index} #{pane_current_command} '
set -g pane-border-style 'fg=#4C566A'
set -g pane-active-border-style 'fg=#2E3440 bg=#A3BE8C bold'

# statusbar
set -g status-position bottom
set -g status-justify left
set -g status-style 'fg=#D8DEE9 bg=#3B4252'
set -g status-interval 3
set -g status-left '#[fg=#A3BE8C,bg=#3B4252,bold]#S #[fg=#D8DEE9,bg=#3B4252,nobold]| '
set -g status-right '#{prefix_highlight} #[fg=#ABB2BF,bg=#3B4252]%Y-%m-%d #[fg=#D8DEE9,bg=#3B4252,bold]%H:%M:%S '
set -g status-right-length 80
set -g status-left-length 40

setw -g window-status-current-style 'fg=#88C0D0 bg=#434C5E bold'
setw -g window-status-current-format ' * #I:#W#{?window_zoomed_flag, Z,} '

setw -g window-status-style 'fg=#ABB2BF bg=#3B4252 none'
setw -g window-status-format ' #I:#W '

setw -g window-status-bell-style 'fg=#D8DEE9 bg=#BF616A bold'

# messages
set -g message-style 'fg=#D8DEE9 bg=#3B4252 bold'
set -g message-command-style 'fg=#81A1C1 bg=#3B4252'

# NVIM
set-option -sg escape-time 0
set-option -sa terminal-overrides ',xterm-256color:RGB'
# set-option -ga terminal-overrides ',xterm-256color:Tc'

# History
set -g history-file ~/.tmux_history


# List of plugins
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-sensible'
set -g @plugin 'tmux-plugins/tmux-prefix-highlight'
set -g @plugin 'tmux-plugins/tmux-copycat'
# set -g @plugin 'tmux-plugins/tmux-yank'
# set -g @plugin 'tmux-plugins/tmux-resurrect'
# set -g @plugin 'tmux-plugins/tmux-continuum'
# set -g @plugin 'Morantron/tmux-fingers'

## Prefix Highlight colors
set -g @prefix_highlight_fg '#2E3440' # default is 'colour231'
set -g @prefix_highlight_bg '#EBCB8B,bold'  # default is 'colour04'
set -g @prefix_highlight_show_copy_mode 'on'
set -g @prefix_highlight_copy_mode_attr 'fg=#2E3440,bg=#EBCB8B,bold' # default is 'fg=default,bg=yellow'

# set -g @continuum-restore 'on'

# Initialize TMUX plugin manager (keep this line at the very bottom of tmux.conf)
run -b '~/.tmux/plugins/tpm/tpm'
