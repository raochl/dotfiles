- defaults:
    link:
        create: true
        relink: true

- clean: ['~']

- link:
    ~/.vim:
    ~/.vimrc:
    ~/.zshrc:
    ~/.bashrc:
    ~/.bash_profile:
    ~/.bash:
    ~/.gitconfig:
    ~/.gitignore_global:
    ~/.config/nvim: nvim
    ~/.config/herdr/config.toml:
        force: true
        path: herdr/config.toml
    ~/.shell:
    ~/.zsh:
    ~/.tmux:
    ~/.tmux.conf:

- shell:
    - git submodule sync --recursive 
    # the following have to run after linking ~/.gitconfig 
    - git update-submodules
    - >
      git cleanall -f 
      shell/plugins/
      vim/pack/vendor/start/
      zsh/plugins/
